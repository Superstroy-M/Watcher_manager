<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Скриншоты — SyncLayer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
  .pc-btn { transition: all .15s; }
  .pc-btn.active { background: #4f46e5; border-color: #6366f1; color: #fff; }
  .pc-btn:not(.active):hover { border-color: #6366f1; }
  .day-btn { transition: all .15s; }
  .day-btn.active { background: #059669; border-color: #10b981; color: #fff; }
  .day-btn:not(.active):hover { border-color: #10b981; }
  .shot-thumb { cursor: zoom-in; border-radius: 6px; overflow: hidden; transition: transform .15s, box-shadow .15s; }
  .shot-thumb:hover { transform: scale(1.03); box-shadow: 0 0 0 2px #6366f1; }
  #lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.93); z-index:9999; align-items:center; justify-content:center; flex-direction:column; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:94vw; max-height:86vh; border-radius:8px; }
  #lb-close { position:fixed;top:16px;right:24px;font-size:30px;color:#fff;cursor:pointer; }
  #lb-prev,#lb-next { position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:#fff;font-size:28px;padding:12px 18px;cursor:pointer;border-radius:8px; }
  #lb-prev{left:10px;}#lb-next{right:10px;}
  #lb-prev:hover,#lb-next:hover{background:rgba(255,255,255,.2);}
  #lb-info{color:#94a3b8;margin-top:10px;font-size:13px;}
</style>
</head>
<body class="p-6">

<div id="lightbox">
  <span id="lb-close" onclick="closeLB()">✕</span>
  <button id="lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lb-img" src="" alt="">
  <div id="lb-info"></div>
  <button id="lb-next" onclick="lbNav(1)">›</button>
</div>

<div class="max-w-7xl mx-auto">

  <div class="flex items-center gap-4 mb-6">
    <a href="/" class="text-slate-400 hover:text-white text-sm">← Все ПК</a>
    <h1 class="text-2xl font-bold text-white">Просмотр скриншотов</h1>
  </div>

  <!-- Шаг 1: выбор ПК -->
  <div class="card p-5 mb-5">
    <div class="text-xs text-slate-500 uppercase font-semibold mb-3">Шаг 1 — Выберите ПК</div>
    <div id="pc-list" class="flex flex-wrap gap-2">
      <span class="text-slate-500 text-sm">Загрузка...</span>
    </div>
  </div>

  <!-- Шаг 2: выбор даты -->
  <div class="card p-5 mb-5" id="day-section" style="display:none">
    <div class="text-xs text-slate-500 uppercase font-semibold mb-3">Шаг 2 — Выберите дату</div>
    <div id="day-list" class="flex flex-wrap gap-2"></div>
  </div>

  <!-- Шаг 3: скриншоты -->
  <div id="shots-section" style="display:none">
    <!-- Фильтр -->
    <div class="card p-4 mb-4 flex flex-wrap gap-4 items-center">
      <span class="text-slate-400 text-sm font-medium" id="shots-title">Скриншоты</span>
      <div class="flex items-center gap-2 ml-auto">
        <input type="time" id="tf" value="00:00" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-white text-sm focus:outline-none">
        <span class="text-slate-500">—</span>
        <input type="time" id="tt" value="23:59" class="bg-slate-700 border border-slate-600 rounded px-3 py-1.5 text-white text-sm focus:outline-none">
        <button onclick="applyFilter()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-3 py-1.5 rounded-lg">Показать</button>
        <button onclick="resetFilter()" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-3 py-1.5 rounded-lg">Всё</button>
        <a id="report-link" href="#" target="_blank" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-3 py-1.5 rounded-lg hidden">⬇ Отчёт .txt</a>
        <span class="text-slate-500 text-sm" id="count-label"></span>
      </div>
    </div>

    <!-- Сетка -->
    <div id="shots-grid" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-2"></div>

    <div id="shots-empty" class="text-center py-16 text-slate-500" style="display:none">
      <div class="text-4xl mb-3">📷</div>
      <div>Нет скриншотов за выбранный период</div>
    </div>
  </div>

</div>

<script>
let allComputers = [];
let allShots = [];
let lbIdx = 0;
let selectedPc = null;
let selectedDay = null;

// Загружаем список ПК
fetch('/api/computers')
  .then(r => r.json())
  .then(data => {
    allComputers = data;
    const list = document.getElementById('pc-list');
    list.innerHTML = '';
    data.forEach(pc => {
      const btn = document.createElement('button');
      btn.className = 'pc-btn card px-4 py-2 text-sm flex items-center gap-2';
      btn.dataset.id = pc.id;
      btn.dataset.hostname = pc.hostname;
      btn.innerHTML = `
        <span class="inline-block w-2 h-2 rounded-full ${pc.is_online ? 'bg-green-400' : 'bg-slate-500'}"></span>
        <span class="font-medium">${pc.hostname}</span>
        <span class="text-slate-500">${pc.username || ''}</span>
      `;
      btn.onclick = () => selectPc(pc.id, pc.hostname, btn);
      list.appendChild(btn);
    });
  });

function selectPc(id, hostname, btn) {
  selectedPc = { id, hostname };
  document.querySelectorAll('.pc-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('day-section').style.display = 'block';
  document.getElementById('shots-section').style.display = 'none';
  document.getElementById('day-list').innerHTML = '<span class="text-slate-500 text-sm">Загрузка дат...</span>';

  fetch(`/api/computer/${id}/screenshot-days`)
    .then(r => r.json())
    .then(days => {
      const list = document.getElementById('day-list');
      list.innerHTML = '';
      if (!days.length) {
        list.innerHTML = '<span class="text-slate-500 text-sm">Нет скриншотов</span>';
        return;
      }
      days.forEach(day => {
        const [y, m, d] = day.split('-');
        const label = `${d}.${m}.${y}`;
        const btn = document.createElement('button');
        btn.className = 'day-btn card px-4 py-2 text-sm font-medium text-slate-300';
        btn.textContent = label;
        btn.dataset.day = day;
        btn.onclick = () => selectDay(day, btn);
        list.appendChild(btn);
      });
    });
}

function selectDay(day, btn) {
  selectedDay = day;
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('shots-section').style.display = 'block';
  document.getElementById('shots-grid').innerHTML = '<div class="col-span-full text-center py-8 text-slate-500">Загрузка...</div>';

  fetch(`/screenshots/api/${selectedPc.hostname}/${day}`)
    .then(r => r.json())
    .then(shots => {
      allShots = shots;
      renderShots(shots);
      const [y, m, d] = day.split('-');
      document.getElementById('shots-title').textContent =
        `${selectedPc.hostname} — ${d}.${m}.${y} — ${shots.length} скриншотов`;
      const rlink = document.getElementById('report-link');
      rlink.href = `/report/${selectedPc.hostname}/${day}`;
      rlink.classList.remove('hidden');
    });
}

function renderShots(shots) {
  const grid = document.getElementById('shots-grid');
  const empty = document.getElementById('shots-empty');
  grid.innerHTML = '';

  if (!shots.length) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

    shots.forEach((shot, idx) => {
    const div = document.createElement('div');
    div.className = 'shot-thumb bg-slate-800';
    div.dataset.time = shot.time;
    div.onclick = () => openLB(idx);

    const prodColor = {
      productive: 'bg-green-500',
      distracting: 'bg-red-500',
      neutral: 'bg-blue-500',
    }[shot.productivity || 'neutral'] || 'bg-blue-500';

    const appLabel = shot.app ? `
      <div class="flex items-center gap-1 px-2 py-1">
        <span class="inline-block w-2 h-2 rounded-full ${prodColor} flex-shrink-0"></span>
        <span class="text-xs text-slate-300 truncate font-medium">${shot.app}</span>
      </div>
      <div class="px-2 pb-1 text-xs text-slate-500 truncate">${(shot.title || '').slice(0, 40)}</div>
    ` : `<div class="px-2 py-1 text-xs text-slate-500 font-mono">${shot.time}</div>`;

    div.innerHTML = `
      <img src="${shot.url}" alt="${shot.time}" loading="lazy" class="w-full aspect-video object-cover">
      <div class="text-right pr-2 pt-0.5 text-xs text-slate-600 font-mono">${shot.time}</div>
      ${appLabel}
    `;
    grid.appendChild(div);
  });

  document.getElementById('count-label').textContent = `${shots.length} скриншотов`;
}

function applyFilter() {
  const from = document.getElementById('tf').value;
  const to = document.getElementById('tt').value;
  const filtered = allShots.filter(s => s.time >= from && s.time <= to);
  renderShots(filtered);
}
function resetFilter() {
  document.getElementById('tf').value = '00:00';
  document.getElementById('tt').value = '23:59';
  renderShots(allShots);
}

// Лайтбокс
function openLB(idx) {
  lbIdx = idx;
  _updateLB();
  document.getElementById('lightbox').classList.add('open');
}
function closeLB() { document.getElementById('lightbox').classList.remove('open'); }
function lbNav(d) { lbIdx = (lbIdx + d + allShots.length) % allShots.length; _updateLB(); }
function _updateLB() {
  const shot = allShots[lbIdx];
  document.getElementById('lb-img').src = shot.url;
  const app = shot.app ? ` · ${shot.app}` : '';
  const title = shot.title ? ` — ${shot.title.slice(0, 60)}` : '';
  document.getElementById('lb-info').textContent =
    `${selectedPc?.hostname || ''} · ${selectedDay || ''} · ${shot.time}${app}${title} · ${lbIdx+1}/${allShots.length}`;
}
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'ArrowRight') lbNav(1);
  if (e.key === 'ArrowLeft') lbNav(-1);
  if (e.key === 'Escape') closeLB();
});
</script>
</body>
</html>

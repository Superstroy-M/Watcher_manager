<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галерея — SyncLayer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#0a0f1e; color:#e2e8f0; font-family:'Segoe UI',sans-serif; }
.card { background:#1e293b; border:1px solid #334155; border-radius:12px; }
.pc-btn, .day-btn { transition:all .15s; cursor:pointer; }
.pc-btn.active { background:#4f46e5; border-color:#6366f1 !important; color:#fff; }
.day-btn.active { background:#059669; border-color:#10b981 !important; color:#fff; }

/* Таймлайн */
#timeline-wrap { position:relative; overflow:hidden; }
.tl-bar { height:28px; border-radius:4px; cursor:pointer; position:absolute; top:0; transition:opacity .15s; }
.tl-bar:hover { opacity:.75; }
.tl-labels { position:relative; height:18px; }
.tl-label { position:absolute; font-size:11px; color:#475569; transform:translateX(-50%); }

/* Фильтры */
.filter-btn { padding:6px 14px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid #334155; cursor:pointer; transition:all .15s; }
.filter-btn.active { background:#4f46e5; border-color:#6366f1; color:#fff; }
.filter-btn:not(.active):hover { border-color:#6366f1; }

/* Сессии */
.session-block { border-left:3px solid var(--color,#3b82f6); }
.prod-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

/* Скриншоты в сессии */
.shots-strip { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
.shots-strip::-webkit-scrollbar { height:4px; }
.shots-strip::-webkit-scrollbar-track { background:#0f172a; }
.shots-strip::-webkit-scrollbar-thumb { background:#334155; border-radius:2px; }
.shot-mini { flex-shrink:0; width:120px; cursor:zoom-in; border-radius:4px; overflow:hidden; transition:transform .15s,box-shadow .15s; }
.shot-mini:hover { transform:scale(1.05); box-shadow:0 0 0 2px #6366f1; }
.shot-mini img { width:120px; height:68px; object-fit:cover; display:block; }
.shot-mini .shot-time { font-size:10px; color:#475569; text-align:center; padding:2px 0; font-family:monospace; }

/* Лайтбокс */
#lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,.95); z-index:9999; align-items:center; justify-content:center; flex-direction:column; }
#lb.open { display:flex; }
#lb img { max-width:92vw; max-height:84vh; border-radius:8px; }
#lb-close { position:fixed;top:14px;right:22px;font-size:28px;color:#fff;cursor:pointer;z-index:10000; }
#lb-prev,#lb-next { position:fixed;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.1);border:none;color:#fff;font-size:26px;padding:10px 16px;cursor:pointer;border-radius:8px; }
#lb-prev{left:8px;}#lb-next{right:8px;}
#lb-prev:hover,#lb-next:hover{background:rgba(255,255,255,.2);}
#lb-meta { color:#94a3b8; margin-top:10px; font-size:13px; text-align:center; max-width:80vw; }
</style>
</head>
<body>

<!-- Лайтбокс -->
<div id="lb">
  <span id="lb-close" onclick="closeLB()">✕</span>
  <button id="lb-prev" onclick="lbNav(-1)">‹</button>
  <img id="lb-img" src="" alt="">
  <div id="lb-meta"></div>
  <button id="lb-next" onclick="lbNav(1)">›</button>
</div>

<div class="max-w-7xl mx-auto p-6">

  <!-- Навигация -->
  <div class="flex items-center gap-4 mb-6">
    <a href="/" class="text-slate-400 hover:text-white text-sm">← Все ПК</a>
    <a href="/live" class="text-slate-400 hover:text-white text-sm">Live</a>
    <h1 class="text-2xl font-bold text-white">Галерея активности</h1>
  </div>

  <!-- Шаг 1: ПК -->
  <div class="card p-5 mb-4">
    <div class="text-xs text-slate-500 uppercase font-semibold tracking-wider mb-3">Компьютер</div>
    <div id="pc-list" class="flex flex-wrap gap-2"><span class="text-slate-500 text-sm">Загрузка...</span></div>
  </div>

  <!-- Шаг 2: Дата -->
  <div class="card p-5 mb-4" id="day-section" style="display:none">
    <div class="text-xs text-slate-500 uppercase font-semibold tracking-wider mb-3">Дата</div>
    <div id="day-list" class="flex flex-wrap gap-2"></div>
  </div>

  <!-- Основной контент -->
  <div id="main-section" style="display:none">

    <!-- Summary -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-4" id="summary-cards"></div>

    <!-- Таймлайн -->
    <div class="card p-5 mb-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Таймлайн дня</h2>
        <div class="flex gap-3 text-xs text-slate-500">
          <span><span class="inline-block w-3 h-2 rounded mr-1" style="background:#22c55e"></span>Рабочее</span>
          <span><span class="inline-block w-3 h-2 rounded mr-1" style="background:#3b82f6"></span>Нейтральное</span>
          <span><span class="inline-block w-3 h-2 rounded mr-1" style="background:#ef4444"></span>Отвлечение</span>
          <span><span class="inline-block w-3 h-2 rounded mr-1" style="background:#334155"></span>Простой</span>
        </div>
      </div>
      <div id="tl-labels" class="tl-labels mb-1"></div>
      <div id="timeline-wrap" class="rounded-lg" style="height:28px;background:#0f172a"></div>
    </div>

    <!-- Фильтры -->
    <div class="card p-4 mb-4 flex flex-wrap gap-3 items-center">
      <div class="flex items-center gap-2">
        <span class="text-slate-400 text-sm">Время:</span>
        <input type="time" id="tf" value="00:00" class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white text-sm focus:outline-none focus:border-indigo-500">
        <span class="text-slate-500">—</span>
        <input type="time" id="tt" value="23:59" class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-white text-sm focus:outline-none focus:border-indigo-500">
      </div>

      <div class="flex gap-2" id="app-filters">
        <button class="filter-btn active" data-app="all">Все</button>
      </div>

      <div class="flex gap-2">
        <button class="filter-btn active" id="f-active" onclick="toggleFilter('active')">Активность</button>
        <button class="filter-btn active" id="f-idle" onclick="toggleFilter('idle')">Простой</button>
      </div>

      <button onclick="applyFilters()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-4 py-1.5 rounded-lg ml-auto">Применить</button>
      <button onclick="resetFilters()" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-4 py-1.5 rounded-lg">Сбросить</button>

      <a id="report-link" href="#" target="_blank" class="bg-emerald-700 hover:bg-emerald-600 text-white text-sm px-4 py-1.5 rounded-lg">📄 HTML отчёт</a>
      <span id="session-count" class="text-slate-500 text-sm"></span>
    </div>

    <!-- Сессии -->
    <div id="sessions-list" class="space-y-3"></div>

    <div id="sessions-empty" class="text-center py-16 text-slate-500" style="display:none">
      <div class="text-4xl mb-3">🔍</div>
      <div>Нет данных по выбранным фильтрам</div>
    </div>
  </div>

</div>

<script>
const COLORS = { productive:'#22c55e', neutral:'#3b82f6', distracting:'#ef4444', idle:'#334155' };
const PROD_RU = { productive:'Рабочее', neutral:'Нейтральное', distracting:'Отвлечение', idle:'Простой' };

let allTimeline = [];
let allScreenshots = [];
let lbShots = [];  // текущий набор для лайтбокса
let lbIdx = 0;
let selectedPc = null;
let selectedDay = null;
let showActive = true, showIdle = true, selectedApp = 'all';

// ── Загрузка ПК ──────────────────────────────────────────────────────────────
fetch('/api/computers').then(r => r.json()).then(data => {
  const list = document.getElementById('pc-list');
  list.innerHTML = '';
  data.forEach(pc => {
    const btn = document.createElement('button');
    btn.className = 'pc-btn card px-4 py-2 text-sm flex items-center gap-2';
    btn.innerHTML = `<span class="w-2 h-2 rounded-full ${pc.is_online ? 'bg-green-400' : 'bg-slate-500'}"></span>
      <span class="font-medium">${pc.hostname}</span>
      <span class="text-slate-500 text-xs">${pc.username || ''}</span>`;
    btn.onclick = () => selectPc(pc, btn);
    list.appendChild(btn);
  });
});

function selectPc(pc, btn) {
  selectedPc = pc;
  document.querySelectorAll('.pc-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('day-section').style.display = 'block';
  document.getElementById('main-section').style.display = 'none';
  document.getElementById('day-list').innerHTML = '<span class="text-slate-500 text-sm">Загрузка...</span>';

  fetch(`/api/computer/${pc.id}/screenshot-days`).then(r => r.json()).then(days => {
    const list = document.getElementById('day-list');
    list.innerHTML = '';
    if (!days.length) { list.innerHTML = '<span class="text-slate-500 text-sm">Нет данных</span>'; return; }
    days.forEach(day => {
      const [y,m,d] = day.split('-');
      const btn = document.createElement('button');
      btn.className = 'day-btn card px-4 py-2 text-sm font-medium text-slate-300';
      btn.textContent = `${d}.${m}.${y}`;
      btn.onclick = () => selectDay(day, btn);
      list.appendChild(btn);
    });
  });
}

function selectDay(day, btn) {
  selectedDay = day;
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('main-section').style.display = 'block';
  document.getElementById('sessions-list').innerHTML = '<div class="text-center py-8 text-slate-500">Загрузка...</div>';

  const rlink = document.getElementById('report-link');
  rlink.href = `/report/${selectedPc.hostname}/${day}`;

  // Грузим timeline + screenshots параллельно
  Promise.all([
    fetch(`/api/activity/${selectedPc.hostname}/${day}/timeline`).then(r => r.json()),
    fetch(`/api/screenshots/${selectedPc.hostname}/${day}`).then(r => r.json()),
    fetch(`/api/activity/${selectedPc.hostname}/${day}/summary`).then(r => r.json()),
  ]).then(([timeline, screensData, summary]) => {
    allTimeline = Array.isArray(timeline) ? timeline : [];
    allScreenshots = Array.isArray(screensData) ? screensData : (screensData.screenshots || []);

    renderSummary(summary);
    renderTimeline(allTimeline);
    buildAppFilters(allTimeline);
    applyFilters();
  });
}

// ── Summary ──────────────────────────────────────────────────────────────────
function renderSummary(s) {
  if (!s || typeof s !== 'object') return;
  const p = s.productivity || {};
  const cards = [
    { val: s.active_formatted || '—', label: 'Активное время', color: '#22c55e' },
    { val: s.idle_formatted || '—', label: 'Простой', color: '#475569' },
    { val: (p.productive_percent || 0) + '%', label: 'Продуктивность', color: '#22c55e' },
    { val: p.distracting_formatted || '—', label: 'Отвлечения', color: '#ef4444' },
    { val: (s.switch_count || 0) + ' переключений', label: 'Смен приложений', color: '#6366f1' },
  ];
  document.getElementById('summary-cards').innerHTML = cards.map(c => `
    <div class="card p-4 text-center">
      <div class="text-xl font-bold" style="color:${c.color}">${c.val}</div>
      <div class="text-xs text-slate-500 mt-1">${c.label}</div>
    </div>`).join('');
}

// ── Таймлайн ─────────────────────────────────────────────────────────────────
function renderTimeline(sessions) {
  const wrap = document.getElementById('timeline-wrap');
  const labelsEl = document.getElementById('tl-labels');
  wrap.innerHTML = '';
  labelsEl.innerHTML = '';
  if (!sessions.length) return;

  const toSec = ts => {
    const t = (ts||'').replace('T',' ').split(' ').pop().slice(0,8).split(':');
    return (+t[0]||0)*3600 + (+t[1]||0)*60 + (+t[2]||0);
  };

  const minSec = Math.min(...sessions.map(s => toSec(s.started_at)));
  const maxSec = Math.max(...sessions.map(s => toSec(s.ended_at || s.started_at) + (s.duration_seconds||0)));
  const span = Math.max(maxSec - minSec, 1);

  sessions.forEach(sess => {
    const left = (toSec(sess.started_at) - minSec) / span * 100;
    const width = Math.max((sess.duration_seconds||0) / span * 100, 0.3);
    const color = COLORS[sess.productivity] || COLORS.neutral;
    const bar = document.createElement('div');
    bar.className = 'tl-bar';
    bar.style.cssText = `left:${left.toFixed(2)}%;width:${width.toFixed(2)}%;background:${color};`;
    bar.title = `${sess.app_name} · ${sess.window_title || ''} · ${fmtDur(sess.duration_seconds)}`;
    bar.onclick = () => scrollToSession(sess.session_id);
    wrap.appendChild(bar);
  });

  // Часовые метки
  const startH = Math.floor(minSec/3600), endH = Math.ceil(maxSec/3600);
  for (let h = startH; h <= endH; h++) {
    const pos = ((h*3600 - minSec) / span * 100).toFixed(1);
    if (pos >= 0 && pos <= 100) {
      labelsEl.innerHTML += `<span class="tl-label" style="left:${pos}%">${String(h).padStart(2,'0')}:00</span>`;
    }
  }
}

// ── Фильтры приложений ────────────────────────────────────────────────────────
function buildAppFilters(sessions) {
  const apps = new Map();
  sessions.forEach(s => {
    if (s.app && s.app !== 'idle') apps.set(s.app, s.app_name || s.app);
  });
  const wrap = document.getElementById('app-filters');
  wrap.innerHTML = '<button class="filter-btn active" data-app="all" onclick="setApp(\'all\',this)">Все</button>';
  apps.forEach((name, app) => {
    wrap.innerHTML += `<button class="filter-btn" data-app="${app}" onclick="setApp('${app}',this)">${name}</button>`;
  });
}

function setApp(app, btn) {
  selectedApp = app;
  document.querySelectorAll('#app-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function toggleFilter(type) {
  if (type === 'active') { showActive = !showActive; document.getElementById('f-active').classList.toggle('active', showActive); }
  if (type === 'idle')   { showIdle   = !showIdle;   document.getElementById('f-idle').classList.toggle('active', showIdle); }
}

function resetFilters() {
  showActive = showIdle = true;
  selectedApp = 'all';
  document.getElementById('f-active').classList.add('active');
  document.getElementById('f-idle').classList.add('active');
  document.getElementById('tf').value = '00:00';
  document.getElementById('tt').value = '23:59';
  document.querySelectorAll('#app-filters .filter-btn').forEach((b,i) => b.classList.toggle('active', i===0));
  applyFilters();
}

function applyFilters() {
  const from = document.getElementById('tf').value;
  const to   = document.getElementById('tt').value;

  const filtered = allTimeline.filter(sess => {
    const t = (sess.started_at||'').slice(11,16);
    if (t < from || t > to) return false;
    if (sess.app === 'idle' && !showIdle) return false;
    if (sess.app !== 'idle' && !showActive) return false;
    if (selectedApp !== 'all' && sess.app !== selectedApp) return false;
    return true;
  });

  renderSessions(filtered);
  document.getElementById('session-count').textContent = `${filtered.length} сессий`;
}

// ── Сессии ────────────────────────────────────────────────────────────────────
function renderSessions(sessions) {
  const list = document.getElementById('sessions-list');
  const empty = document.getElementById('sessions-empty');
  list.innerHTML = '';

  if (!sessions.length) { empty.style.display='block'; return; }
  empty.style.display='none';

  sessions.forEach(sess => {
    const color = COLORS[sess.productivity] || COLORS.neutral;
    const prodRu = PROD_RU[sess.productivity] || '';
    const tStart = (sess.started_at||'').slice(11,16);
    const tEnd   = (sess.ended_at||'').slice(11,16);
    const dur    = fmtDur(sess.duration_seconds);
    const isIdle = sess.app === 'idle';

    // Скриншоты для этой сессии
    const sesShots = sess.screenshots && sess.screenshots.length
      ? sess.screenshots.map(fname => {
          const shotTime = fname.replace('.jpg','').replace(/-/g,':');
          const found = allScreenshots.find && allScreenshots.find(s => s.time === shotTime);
          return found ? found : { time: shotTime, url: null };
        }).filter(s => s.url)
      : [];

    const shotsHtml = sesShots.length ? `
      <div class="shots-strip mt-2">
        ${sesShots.map((s, i) => `
          <div class="shot-mini" onclick="openLBSession(${JSON.stringify(sess.session_id).replace(/"/g,'&quot;')}, ${i})">
            <img src="${s.url}" loading="lazy" alt="${s.time}">
            <div class="shot-time">${s.time}</div>
          </div>`).join('')}
      </div>` : '';

    const div = document.createElement('div');
    div.className = 'card p-4 session-block';
    div.id = `sess-${sess.session_id}`;
    div.style.setProperty('--color', color);
    div.innerHTML = isIdle ? `
      <div class="flex items-center gap-3 text-slate-500">
        <span class="font-mono text-sm">${tStart}–${tEnd}</span>
        <span class="text-slate-600">│</span>
        <span>Простой</span>
        <span class="ml-auto text-sm">${dur}</span>
      </div>` : `
      <div class="flex items-start gap-3 flex-wrap">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="prod-dot" style="background:${color}"></span>
            <span class="font-semibold text-white">${sess.app_name || sess.app}</span>
            <span class="text-xs px-2 py-0.5 rounded-full" style="background:${color}22;color:${color};border:1px solid ${color}44">${prodRu}</span>
          </div>
          <div class="text-slate-400 text-sm mt-1 truncate" title="${sess.window_title||''}">${sess.window_title||''}</div>
          ${shotsHtml}
        </div>
        <div class="text-right flex-shrink-0">
          <div class="font-mono text-sm text-slate-400">${tStart}–${tEnd}</div>
          <div class="text-lg font-bold text-white mt-1">${dur}</div>
          ${sess.screenshot_count ? `<div class="text-xs text-slate-500 mt-1">${sess.screenshot_count} скрин.</div>` : ''}
        </div>
      </div>`;
    list.appendChild(div);
  });

  // Строим карту session_id → screenshots для лайтбокса
  window._sessionShotsMap = {};
  sessions.forEach(sess => {
    if (!sess.screenshots) return;
    window._sessionShotsMap[sess.session_id] = sess.screenshots
      .map(fname => {
        const t = fname.replace('.jpg','').replace(/-/g,':');
        return allScreenshots.find && allScreenshots.find(s => s.time === t);
      }).filter(Boolean);
  });
}

function scrollToSession(id) {
  const el = document.getElementById('sess-' + id);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
}

// ── Лайтбокс ─────────────────────────────────────────────────────────────────
function openLBSession(sessionId, idx) {
  lbShots = (window._sessionShotsMap || {})[sessionId] || [];
  lbIdx = idx;
  if (!lbShots.length) return;
  _updateLB();
  document.getElementById('lb').classList.add('open');
}

function openLBAll(idx) {
  lbShots = allScreenshots;
  lbIdx = idx;
  _updateLB();
  document.getElementById('lb').classList.add('open');
}

function closeLB() { document.getElementById('lb').classList.remove('open'); }
function lbNav(d) { lbIdx = (lbIdx + d + lbShots.length) % lbShots.length; _updateLB(); }

function _updateLB() {
  const shot = lbShots[lbIdx];
  if (!shot) return;
  document.getElementById('lb-img').src = shot.url;
  const app = shot.app_name || shot.app || '';
  const title = shot.window_title || shot.title || '';
  document.getElementById('lb-meta').textContent =
    `${selectedPc?.hostname || ''} · ${selectedDay || ''} · ${shot.time}${app ? ' · ' + app : ''}${title ? ' — ' + title.slice(0,60) : ''} · ${lbIdx+1}/${lbShots.length}`;
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('lb').classList.contains('open')) return;
  if (e.key==='ArrowRight') lbNav(1);
  if (e.key==='ArrowLeft')  lbNav(-1);
  if (e.key==='Escape')     closeLB();
});

function fmtDur(s) {
  if (!s || s < 60) return `${s||0}с`;
  if (s < 3600) return `${Math.floor(s/60)}м ${s%60}с`;
  return `${Math.floor(s/3600)}ч ${Math.floor((s%3600)/60)}м`;
}
</script>
</body>
</html>

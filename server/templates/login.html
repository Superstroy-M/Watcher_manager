<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — SyncLayer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
  <div class="card w-full max-w-md p-8">
    <h1 class="text-2xl font-bold text-white mb-2">SyncLayer</h1>
    <p class="text-slate-400 text-sm mb-6">Вход в панель мониторинга</p>

    {% if error %}
    <div class="mb-4 rounded-lg border border-red-500/40 bg-red-500/10 px-4 py-3 text-sm text-red-300">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label class="block text-sm text-slate-400 mb-1" for="username">Логин</label>
        <input id="username" name="username" type="text" autocomplete="username" required
               class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-white focus:border-indigo-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1" for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-white focus:border-indigo-500 focus:outline-none">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-indigo-600 py-2.5 text-sm font-medium text-white hover:bg-indigo-700">
        Войти
      </button>
    </form>
  </div>
</body>
</html>

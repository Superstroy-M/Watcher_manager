version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: watcher_postgres
    restart: always
    environment:
      POSTGRES_USER: watcher
      POSTGRES_PASSWORD: watcher_pass
      POSTGRES_DB: watcher_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: .
    container_name: watcher_server
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://watcher:watcher_pass@postgres:5432/watcher_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres_data:

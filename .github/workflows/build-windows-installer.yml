name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "agent/app_main.py"
      - "agent/screenshot.py"
      - "agent/config.py"
      - "agent/requirements.txt"
      - "agent/build_setup.ps1"
      - "agent/verify_build_url.py"
      - "agent/install_common.ps1"
      - "agent/install_finalize.ps1"
      - "agent/install_verify.ps1"
      - "agent/installer/**"
      - "agent/icon.png"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Verify config.py before build
        shell: powershell
        working-directory: agent
        run: python verify_build_url.py config

      - name: Build SyncLayerSetup.exe
        shell: powershell
        working-directory: agent
        run: .\build_setup.ps1

      - name: Verify SyncLayerAgent.exe URL in binary
        shell: powershell
        working-directory: agent
        run: python verify_build_url.py agent-exe --path dist/SyncLayerAgent.exe

      - name: Verify installer artifact
        shell: powershell
        working-directory: agent
        run: |
          python verify_build_url.py installer --path dist/SyncLayerSetup.exe
          if (-not (Test-Path "dist/SyncLayerSetup.exe")) { throw "SyncLayerSetup.exe missing" }
          $extra = Get-ChildItem dist -File | Where-Object { $_.Name -ne "SyncLayerSetup.exe" }
          if ($extra) {
            Write-Host "dist/ also contains (not uploaded): $($extra.Name -join ', ')"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SyncLayerSetup
          path: agent/dist/SyncLayerSetup.exe
          if-no-files-found: error

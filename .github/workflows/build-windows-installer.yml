name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "agent/**"
      - ".github/workflows/build-windows-installer.yml"

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Verify config.py SERVER_URL
        shell: powershell
        working-directory: agent
        run: python verify_build_url.py config

      - name: Install Python dependencies
        shell: powershell
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build SyncLayerAgent.exe
        shell: powershell
        working-directory: agent
        run: .\build_setup.ps1 -AgentOnly

      - name: Build SyncLayerSetup.exe
        shell: powershell
        working-directory: agent
        run: .\build_setup.ps1 -InstallerOnly

      - name: Upload SyncLayerSetup.exe
        uses: actions/upload-artifact@v4
        with:
          name: SyncLayerSetup
          path: agent/dist/SyncLayerSetup.exe
          if-no-files-found: error
